<!DOCTYPE html>
<html>
    <head>
        <title>My Website</title>
    </head>
    <body>
        <!-- Heading <h1> sampai <h6> -->
        <h1>My Header</h1>
        <h6>My Small Header</h6>

        <!-- Menu -->
        <!-- path yang pasti pakai absolute link : -->
        <a href="https://sim.petra.ac.id">Link ke sim.petra</a> | 
        <a href="https://bap.petra.ac.id">Link ke bap.petra</a> |
        <a href="biodata.html">Biodata saya</a>
        <!-- <p> : paragraph -->
        <p>
            Ini adalah halaman utama
        </p>
        <!-- aset gambar pakai relative link : -->
        <img src="images/gambar1.png" width="150px">
        
        <div style="border:2px solid black; background-color: green;">
            <!-- span : inline text -->
            <span>Komentar : </span>
            <input type="text">
            <textarea></textarea>
            <button>Kirim</button>
            <br>
            <!-- <table> -->
            <table border="1">
                <!-- thead : baris utama tabel -->
                <thead>
                    <!-- tr : table row -->
                    <tr>
                        <th>No</th>
                        <th>NRP</th>
                        <th>Nama</th>
                    </tr>
                </thead>
                <!-- tbody : body tabel -->
                <tbody>
                    <!-- tr : table row -->
                    <tr>
                        <td>1</td>
                        <td>C14240001</td>
                        <td>A</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>C14240002</td>
                        <td>B</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- unordered list <ul> -->
        <ul>
            <li>unordered 1</li>
            <li>unordered 2</li>
        </ul>

        <!-- ordered list <ol> -->
        <ol>
            <!-- list -->
            <li>list 1</li>
            <li>list 2</li>
            <li>list A</li>
            <li>list 3</li>
        </ol>
        <!-- <br> - break row / enter / \n / new line -->
        <br><br><br><br><br>
    </body>
</html>
